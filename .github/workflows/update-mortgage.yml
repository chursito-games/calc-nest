name: Update mortgage snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "15 18 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update mortgage snapshot
        run: python scripts/update_mortgage_snapshot.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/mortgage_snapshot.json; then
            echo "No mortgage snapshot changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/mortgage_snapshot.json
          git commit -m "Update mortgage snapshot"
          git push
